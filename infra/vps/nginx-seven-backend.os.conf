# PROPOSTA para o corte (nao esta em uso): o arquivo atual da VPS (nginx-seven-backend.conf) mais a rota /os/ para o os_api.
# O bloco location / do robo nao muda. Depois de aplicar: nginx -t && systemctl reload nginx.
server {
    listen 80;
    listen [::]:80;
    server_name srv1002700.hstgr.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name srv1002700.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/srv1002700.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1002700.hstgr.cloud/privkey.pem;

    client_max_body_size 50m;

    location /os/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-XSS-Protection "1; mode=block" always;
}
